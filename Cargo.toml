[package]
name = "ptp-clock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Complete mechanism layer for the Linux PTP hardware clock (PHC): the PTP_* ioctl family and hardware timestamping."
documentation = "https://docs.rs/ptp-clock"
repository = "https://github.com/lenitain/ptp-clock"
readme = "README.md"
keywords = ["ptp", "phc", "clock", "linux", "timestamp"]
categories = ["os::linux-apis", "hardware-support"]
authors = ["ptp-clock contributors"]

include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "examples/",
    "src/",
    "tests/",
]

[lib]
name = "ptp_clock"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
